# ==========================================================================
# CANONICAL HOST
# www and non-www both served identical content with HTTP 200 and no canonical
# tag. Google confirmed the damage in Search Console on 2026-09-20:
#   "Duplicate without user-selected canonical"
#   Google-selected canonical: https://www.raghavendrakulkarni.com/
# The bare domain is now the single canonical host; www redirects to it.
# ==========================================================================
server {
    listen 80;
    server_name www.raghavendrakulkarni.com;
    return 301 https://raghavendrakulkarni.com$request_uri;
}

server {
    listen 80 default_server;
    server_name raghavendrakulkarni.com _;
    root /usr/share/nginx/html;

    # Astro emits /about-us/index.html and canonicals point at /about-us,
    # so nginx must never add its own trailing slash.
    absolute_redirect off;

    # ----------------------------------------------------------------------
    # Exact matches first — these win over every regex below.
    # ----------------------------------------------------------------------
    location = / { try_files /index.html =404; }

    location = /404.html { internal; }

    location = /index.html { return 301 /; }

    location = /robots.txt        { add_header Cache-Control "public, max-age=3600" always; }
    location = /sitemap-index.xml { add_header Cache-Control "public, max-age=3600" always; }
    location = /sitemap-0.xml     { add_header Cache-Control "public, max-age=3600" always; }

    # ----------------------------------------------------------------------
    # Build output is content-hashed — cache it hard, forever.
    # ----------------------------------------------------------------------
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ======================================================================
    # LEGACY URL REDIRECTS
    #
    # Three historical URL shapes must keep working, newest first:
    #
    #   1. HTML era   /blogs/kidney-stones-...-25964.html
    #   2. WordPress  /kidney-stone-treatment/        (trailing slash)
    #   3. HTML era   /about-us.html
    #
    # Search Console listed /kidney-stone-treatment/ among the pages Google
    # had crawled, and every one of those returned 404 before this config.
    # ======================================================================

    # blog posts: strip the WordPress post id and move /blogs/ -> /blog/
    #   /blogs/kidney-stones-risk-factors-...-25964.html  ->  /blog/kidney-stones-risk-factors-...
    location ~ ^/blogs/(?<post>.+?)-\d+\.html$ { return 301 /blog/$post; }
    location ~ ^/blogs/(?<post>.+?)-\d+/?$     { return 301 /blog/$post; }

    # any other /blogs/... shape -> the blog index rather than a dead end.
    # NOTE: this must be a regex, not `^~`. A `^~` prefix match outranks every
    # regex location in nginx, so it would swallow the two specific rules above
    # and send every old post to the blog index instead of to the article.
    location ~ ^/blogs/ { return 301 /blog; }

    # .html suffix -> clean path
    location ~ ^/(?<page>.+)\.html$ { return 301 /$page; }

    # WordPress trailing slash -> clean path
    location ~ ^/(?<page>.+)/$ { return 301 /$page; }

    # ----------------------------------------------------------------------
    # Normal serving. /about-us is served from /about-us/index.html.
    # ----------------------------------------------------------------------
    location / {
        try_files $uri $uri/index.html =404;
    }

    # ----------------------------------------------------------------------
    # Caching for static media (not content-hashed, so a shorter window)
    # ----------------------------------------------------------------------
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # HTML must revalidate, otherwise a redeploy goes unseen by returning visitors
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # ----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ======================================================================
    # REAL 404s
    # The old config had `error_page 404 /index.html`, which served the
    # homepage for every unknown URL with a 200 status. Google treats that as
    # a soft 404 and it suppresses indexing.
    # ======================================================================
    error_page 404 /404.html;
}
