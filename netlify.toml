# =============================================================================
# Netlify deployment config.
#
# The canonical deployment target is the Docker image in this repo, which
# serves dist/ through nginx.conf. Netlify ignores nginx.conf entirely, so the
# redirect map and the security headers defined there are reproduced here.
#
#   redirects -> public/_redirects, generated by
#                scripts/gen-netlify-redirects.mjs (runs as part of `npm run build`)
#   headers   -> this file, below
#
# If you change nginx.conf, change this too, or the two hosts will disagree.
# =============================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # 'clean' emits /about-us and /blog/<slug>; 'legacy' emits the old .html URLs.
  # Must match what the canonical tags and the redirect map assume.
  URL_STRATEGY = "clean"

# --- security headers (mirrors nginx.conf) -----------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    X-Frame-Options = "SAMEORIGIN"

# --- caching (mirrors nginx.conf) --------------------------------------------
# Astro fingerprints everything in /_astro/, so it can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap-index.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap-0.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
